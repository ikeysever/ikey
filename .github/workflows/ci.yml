name: iKey CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o \( -name '*.js' -o -name '*.cjs' \) -type f -print0 | xargs -0 -r -n 1 node --check
      - name: Third-generation auth and Apps Script safety tests
        run: node --test gen3-auth/core.test.js gen3-auth/apps-script.test.js gen3-auth/routes.test.js
      - name: Superadmin session security tests
        run: node --test tests/ikey-admin-session.cjs tests/ikey-admin-http.cjs
      - name: Frontend static integrity tests
        run: node --test tests/ibox-frontend-smoke.cjs tests/home-dashboard.test.cjs
      - name: iBox permission regression tests
        run: node --test tests/ibox-project-access.cjs tests/ibox-project-workflow.cjs
      - name: Start server and verify HTTP health
        shell: bash
        run: |
          set -euo pipefail
          PORT=3100 node server.js > /tmp/ikey-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:3100/api/health > /tmp/ikey-ci-health.json 2>/dev/null; then
              cat /tmp/ikey-ci-health.json
              # Retired global two-device endpoints must not be reachable.
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/device/status)" = "404"
              test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"deviceId":"esp-robot"}' http://127.0.0.1:3100/api/device/heartbeat)" = "404"
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/login/admin/connections)" = "404"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/ikey-ci-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/ikey-ci-server.log
          exit 1
