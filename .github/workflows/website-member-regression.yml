name: iKey website member UI regression
on:
  pull_request:
    paths:
      - 'public/project-members.js'
      - 'public/project-readonly-panels.js'
      - 'public/project.html'
      - 'public/project-create.html'
      - 'public/project-create.js'
      - 'server.js'
      - 'lib/project-members-handler.js'
      - 'tests/project-members-route.test.js'
      - 'tests/project-create-five-step.test.js tests/project-members-route.test.js'
      - 'tests/project-members-display.test.js'
      - 'tests/project-readonly-panels.test.js'
      - '.github/workflows/website-member-regression.yml'
  workflow_dispatch:
jobs:
  member-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JavaScript syntax
        run: |
          node --check public/project-members.js
          node --check public/project-readonly-panels.js
          node --check public/project-create.js
          node --check server.js
          node --check lib/project-members-handler.js
      - name: Run member UI regression tests
        run: node --test tests/project-members-display.test.js tests/project-readonly-panels.test.js tests/project-create-five-step.test.js
