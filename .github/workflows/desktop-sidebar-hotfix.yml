name: Desktop sidebar hotfix checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [hotfix/desktop-sidebar-toggle-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check public/home.js && node --check public/project-sidebar.js
      - run: npm test
