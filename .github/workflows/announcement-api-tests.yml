name: iKey announcement API tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Check server and browser JavaScript syntax
        run: |
          node --check server.js
          node --check gen3-auth/announcement-router.js
          node --check public/announcements-admin.js
          node --check public/announcements-home.js
          cp gen3-auth/Code.gs /tmp/ikey-gen3-code.js
          node --check /tmp/ikey-gen3-code.js
      - run: npm test
