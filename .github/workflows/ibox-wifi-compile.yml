name: iBOX Wi-Fi firmware compile
on:
  push:
    branches:
      - feature/ibox-wifi-security-v2-20261114
    paths:
      - 'firmware/ikey-wifi-portal/**'
      - '.github/workflows/ibox-wifi-compile.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board and ArduinoJson
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@7.4.2"
      - name: Compile for ESP32 Dev Module
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ikey-wifi-portal
