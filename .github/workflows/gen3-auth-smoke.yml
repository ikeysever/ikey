name: Gen3 Auth Read-only Connectivity Test
on:
  workflow_dispatch:
  push:
    branches:
      - feature/gen3-auth-registration
    paths:
      - '.github/workflows/gen3-auth-smoke.yml'
      - 'gen3-auth/smoke.js'
      - 'gen3-auth/sheets-store.js'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required secrets
        env:
          GEN3_APPS_SCRIPT_URL: ${{ secrets.GEN3_APPS_SCRIPT_URL }}
          GEN3_APPS_SCRIPT_KEY: ${{ secrets.GEN3_APPS_SCRIPT_KEY }}
        run: |
          if [ -z "$GEN3_APPS_SCRIPT_URL" ] || [ -z "$GEN3_APPS_SCRIPT_KEY" ]; then
            echo "Missing required GitHub Actions secrets."
            exit 1
          fi
      - name: Read-only Apps Script smoke test
        env:
          GEN3_APPS_SCRIPT_URL: ${{ secrets.GEN3_APPS_SCRIPT_URL }}
          GEN3_APPS_SCRIPT_KEY: ${{ secrets.GEN3_APPS_SCRIPT_KEY }}
        run: node gen3-auth/smoke.js
