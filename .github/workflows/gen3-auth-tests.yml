name: Gen3 Auth Unit Tests
on:
  push:
    branches:
      - feature/gen3-auth-registration
    paths:
      - 'gen3-auth/**'
      - '.github/workflows/gen3-auth-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authentication unit tests
        run: node --test gen3-auth/core.test.js gen3-auth/apps-script.test.js
      - name: Check server-side source syntax
        run: |
          node --check gen3-auth/core.js
          node --check gen3-auth/routes.js
          node --check gen3-auth/sheets-store.js
          node --check gen3-auth/smoke.js
