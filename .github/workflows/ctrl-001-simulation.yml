name: CTRL-001 simulation regression
on:
  pull_request:
    paths:
      - 'device-command-simulation.js'
      - 'tests/device-command-simulation.test.js'
      - 'server.js'
      - 'public/super-admin.html'
      - '.github/workflows/ctrl-001-simulation.yml'
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test tests/device-command-simulation.test.js
