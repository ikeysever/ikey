<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>iKey 第三代｜忘記密碼</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#1b3150 0,#0b1220 42%,#070c16 100%);color:#f4f7fb}
main{width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #334155;border-radius:20px;background:rgba(20,31,52,.86);box-shadow:0 20px 80px #0006}
.logo{display:block;width:90px;height:90px;margin:0 auto 16px}h1{text-align:center;font-size:28px}.muted{color:#a9b7cb;line-height:1.7}label{display:block;margin:18px 0 7px}
input{width:100%;padding:13px;border:1px solid #506078;border-radius:10px;background:#0b1220;color:white;font:inherit}
button{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:700;margin-top:20px;background:#68a9ff;color:#071222;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}a{color:#9ac9ff}#message{min-height:24px;margin-top:16px}
</style></head><body><main>
<img class="logo" src="../public/assets/brand/ikey-nextgen.svg" alt="iKey">
<h1>忘記密碼？</h1><p class="muted">請輸入註冊時使用的電子郵件。密碼重設功能完成後，系統將寄送一次性驗證連結。</p>
<form id="recovery"><label for="email">電子郵件</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="請輸入註冊電子郵件" required>
<button type="submit" disabled>寄送重設連結（準備中）</button></form>
<p id="message" role="status" aria-live="polite">此頁為開發預覽，目前不會寄送電子郵件。</p>
<p><a href="./login.html">← 返回登入頁</a></p>
</main></body></html>
