<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>iKey｜驗證電子郵件</title><style>:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#1b3150 0,#0b1220 42%,#070c16 100%);color:#f4f7fb}main{width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #334155;border-radius:20px;background:rgba(20,31,52,.86);box-shadow:0 20px 80px #0006}h1{font-size:27px}label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #506078;border-radius:10px;background:#0b1220;color:white;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:22px;background:#68a9ff;color:#071222}button:disabled{opacity:.5}a{color:#9ac9ff}#message{min-height:24px;color:#c9e9ff;line-height:1.7}</style></head><body><main><h1>驗證電子郵件</h1><p>請確認這是你本人發起的操作。</p><form id="form"><button type="submit">驗證電子郵件</button></form><p id="message" role="status" aria-live="polite"></p><p><a href="./login.html">返回登入頁</a></p></main><script>const form=document.getElementById("form"),msg=document.getElementById("message"),token=new URLSearchParams(location.search).get("token");history.replaceState(null,"",location.pathname);if(!token){form.hidden=true;msg.textContent="連結無效或已過期";}form.addEventListener("submit",async e=>{e.preventDefault();const payload={token};const btn=form.querySelector("button");btn.disabled=true;try{const r=await fetch("/api/auth/verify-email",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const data=await r.json();msg.textContent=data.message||"操作失敗";if(r.ok)form.hidden=true;}catch{msg.textContent="網路連線失敗，請稍後重試"}finally{btn.disabled=false}});</script></body></html>
