<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>iKey 第三代｜登入</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#1b3150 0,#0b1220 42%,#070c16 100%);color:#f4f7fb}
main{width:min(440px,calc(100% - 32px));padding:32px;border:1px solid #334155;border-radius:20px;background:rgba(20,31,52,.86);box-shadow:0 20px 80px #0006}
.logo{display:block;width:88px;height:88px;margin:0 auto 18px}h1{font-size:27px;text-align:center;margin:0 0 8px}.muted{color:#a9b7cb;text-align:center;margin:0 0 28px}
label{display:block;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #506078;border-radius:10px;background:#0b1220;color:white;font:inherit}
input:focus{outline:2px solid #65a7ff;outline-offset:1px}button,.action{display:block;width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:22px;background:#68a9ff;color:#071222;text-align:center;text-decoration:none}
button:disabled{opacity:.55;cursor:wait}.secondary{background:transparent;color:#d9e5f6;border:1px solid #52637b;margin-top:10px}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:14px}a{color:#9ac9ff}#message{min-height:24px;margin:14px 0 0;color:#ffd4a6;font-size:14px}
[hidden]{display:none!important}.notice{font-size:12px;color:#a9b7cb;margin:22px 0 0;line-height:1.6}
</style></head><body><main>
<img class="logo" src="/assets/brand/ikey-nextgen.svg" alt="iKey">
<h1>歡迎回到 iKey</h1><p class="muted">自動多場景智慧鎖 · 第三代</p>
<form id="login" novalidate><label for="email">帳號或電子郵件</label><input id="email" name="email" type="text" maxlength="254" autocomplete="username" placeholder="請輸入帳號或電子郵件" required>
<label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">登入系統</button></form>
<a id="googleEntry" class="action secondary" href="/api/auth/google/start">使用 Google 登入</a>
<div class="links"><a href="./register.html">建立帳號</a><a href="./forgot-password.html">忘記密碼？</a></div>
<p id="message" role="status" aria-live="polite"></p>
<a id="googleLink" class="action secondary" href="/api/auth/google/link" hidden>綁定 Google 帳號</a>
<a class="action secondary" href="/">返回現有 iKey 網站</a>
<p class="notice">帳號安全：既有電子郵件帳號不會自動與 Google 合併，請先登入再綁定。</p>
</main><script>
const form=document.getElementById('login'),msg=document.getElementById('message'),btn=document.getElementById('submit');

form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';
if(!form.reportValidity())return;
btn.disabled=true;try{const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:form.elements.namedItem('email').value,password:form.elements.namedItem('password').value})});
const data=await response.json();if(!response.ok){msg.textContent=data.message||'登入失敗';return}
location.assign("./account.html");
}catch{msg.textContent='登入服務尚未啟用或連線失敗'}finally{btn.disabled=false}});
fetch("/api/auth/me",{credentials:"same-origin",cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
 if(d?.authenticated)location.replace("./account.html");
}).catch(()=>{});
fetch("/api/auth/status",{credentials:"same-origin",cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
 if(d?.enabled!==true){btn.disabled=true;msg.textContent="第三代帳號服務尚未完成後端連線驗證，請稍後再試。";}
 const google=document.getElementById("googleEntry");
 if(d?.google!==true){
   google.setAttribute("aria-disabled","true");
   google.style.opacity=".55";
   google.addEventListener("click",e=>{e.preventDefault();msg.textContent="Google 登入尚未完成 OAuth 設定。"});
 }
}).catch(()=>{btn.disabled=true;msg.textContent="目前無法確認帳號服務狀態。";});
</script></body></html>
