<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iKey 3.1｜帳號與權限</title><link rel="stylesheet" href="/home.css"><style>body{background:radial-gradient(circle at 20% 0%,#1b3150,#0b1220 42%,#070c16);color:#f8fafc;font-family:system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:20px}.panel{background:rgba(20,31,52,.78);padding:24px;border:1px solid #334b64;border-radius:16px}h1{margin:8px 0}p,small{color:#a6b2c5}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;background:#101d30;color:#f8fafc;border:1px solid #526b85;border-radius:10px;padding:12px}input{flex:1;min-width:180px}button{cursor:pointer}a{color:#63d8e8}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:13px 10px;border-bottom:1px solid #34465a}th{color:#a6b2c5}#status{margin:15px 0}</style></head><body><main><a href="/super-admin.html">← 返回超級管理員控制台</a><h1>帳號與權限</h1><p>正式 Users 資料庫｜超級管理員唯讀查詢</p><section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="搜尋帳號、姓名或角色" aria-label="搜尋帳號"><select id="role" aria-label="篩選角色"><option value="">全部角色</option><option value="super_admin">超級管理員</option><option value="admin">管理員</option><option value="user">一般使用者</option></select><button id="refresh">重新整理</button></div><p id="status" role="status">正在驗證並讀取帳號…</p><div style="overflow-x:auto"><table><thead><tr><th>帳號</th><th>顯示名稱</th><th>角色</th><th>狀態</th><th>建立日期</th></tr></thead><tbody id="rows"></tbody></table></div><p><small>只顯示經後端授權的安全欄位，不提供帳號修改。</small></p></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),names={super_admin:'超級管理員',admin:'管理員',user:'一般使用者'};let accounts=[],limited=false;function render(){const q=$('search').value.trim().toLowerCase(),role=$('role').value;const list=accounts.filter(a=>(!role||a.global_role===role)&&[a.username,a.display_name,a.global_role].some(s=>String(s||'').toLowerCase().includes(q)));$('rows').replaceChildren();for(const a of list){const tr=document.createElement('tr');for(const v of [a.username,a.display_name,names[a.global_role]||a.global_role,a.account_status,String(a.created_at||'').slice(0,10)]){const td=document.createElement('td');td.textContent=v||'—';tr.append(td)}$('rows').append(tr)}$('status').textContent='顯示 '+list.length+' 筆帳號'+(limited?'（最多讀取 100 筆）':'')}async function load(){$('status').textContent='正在讀取真實帳號…';$('rows').replaceChildren();try{const r=await fetch('/api/admin/accounts',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||d.success!==true||!Array.isArray(d.accounts))throw Error(d.message||'讀取失敗');accounts=d.accounts;limited=!!d.limited;render()}catch(e){accounts=[];$('status').textContent=e.message||'讀取失敗'}}$('search').oninput=render;$('role').onchange=render;$('refresh').onclick=load;load()})();</script></body></html>
