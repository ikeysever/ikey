<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>iKey 初始管理員設定</title><style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#fff;margin:0;display:grid;place-items:center;min-height:100vh}main{width:min(90vw,460px);background:#142034;padding:28px;border-radius:18px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}button{margin-top:22px;cursor:pointer}small{color:#bdc8d8}#result{white-space:pre-wrap}</style></head><body><main><h1>iKey 唯一超級管理員初始化</h1><p>帳號：<strong>ikey</strong></p><small>僅首次初始化可用。請勿使用已在聊天中出現的密碼。初始化完成後，請立即移除 Render 的 GEN3_BOOTSTRAP_SECRET。</small><form id="setup"><label for="secret">一次性初始化密鑰（Render 設定值）</label><input id="secret" type="password" autocomplete="off" required minlength="32"><label for="password">新的強密碼（至少 16 字元）</label><input id="password" type="password" autocomplete="new-password" required minlength="16" maxlength="128"><label for="confirm">確認新密碼</label><input id="confirm" type="password" autocomplete="new-password" required minlength="16"><button type="submit">建立唯一超級管理員</button></form><p id="result" role="status"></p></main><script>document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password'),c=document.getElementById('confirm'),s=document.getElementById('secret'),out=document.getElementById('result');if(p.value!==c.value){out.textContent='兩次密碼不一致';return}const btn=e.target.querySelector('button');btn.disabled=true;try{const r=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({setup_secret:s.value,password:p.value})});const d=await r.json();out.textContent=d.message||'初始化未完成';if(r.ok){s.value='';p.value='';c.value='';e.target.hidden=true}}catch{out.textContent='連線失敗，請稍後再試'}finally{btn.disabled=false}})</script></body></html>
