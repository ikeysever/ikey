<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>iKey 3.1｜加入專案</title><link rel="stylesheet" href="/home.css"><style>
.join-layout{max-width:760px;margin:clamp(24px,7vh,84px) auto;padding:20px}.join-back{display:inline-block;margin-bottom:28px;color:#9de9fa}.join-card{background:#142034;border:1px solid #35465e;border-radius:20px;padding:clamp(20px,5vw,36px);color:#f8fafc}.join-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.join-step{background:#1c2c44;border-radius:12px;padding:14px;font-size:.92rem}.join-step strong{display:block;color:#67e8f9;margin-bottom:8px}.join-card label{display:block;font-weight:700;margin:24px 0 8px}.join-card input{width:100%;padding:14px;border-radius:10px;background:#0b1220;border:1px solid #607089;color:#fff;font-size:1rem}.join-card input:disabled{opacity:.75}.join-submit{width:100%;margin-top:16px;border:0;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;background:#476076;color:#fff}.join-note{background:#1d3448;border-left:3px solid #67e8f9;border-radius:6px;padding:14px;line-height:1.7;margin-top:20px}.join-hint{color:#b9c9d9;font-size:.92rem;margin-top:8px}@media(max-width:560px){.join-steps{grid-template-columns:1fr}.join-layout{margin:0 auto;padding:18px}}
</style></head><body><main class="join-layout"><a class="join-back" href="/projects.html">← 返回我的專案</a><header class="hero"><div class="eyebrow">iKey · GENERATION 3.1</div><h1>加入專案</h1><p>取得邀請碼後，就能申請加入其他人的專案。</p></header><section class="join-card" aria-labelledby="join-title"><h2 id="join-title">如何加入？</h2><div class="join-steps"><div class="join-step"><strong>01　取得邀請碼</strong>向專案管理員索取邀請碼。</div><div class="join-step"><strong>02　輸入邀請碼</strong>在下方欄位輸入，確認要加入的專案。</div><div class="join-step"><strong>03　完成加入</strong>依專案設定直接加入，或等待管理員審核。</div></div><label for="join-code">專案邀請碼</label><input id="join-code" type="text" autocomplete="off" spellcheck="false" placeholder="例如：管理員提供的邀請碼" maxlength="64" disabled aria-describedby="join-hint join-note"><p id="join-hint" class="join-hint">邀請碼由專案管理員提供，並非你的帳號密碼。</p><button class="join-submit" type="button" disabled>確認加入專案</button><div id="join-note" class="join-note" role="status"><strong>功能建置中</strong><br>目前尚未開放送出邀請碼。加入及審核功能完成安全測試後，才會啟用此按鈕。</div></section></main></body></html>
