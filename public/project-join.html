<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>iKey 3.1｜加入專案</title><link rel="icon" href="/assets/brand/ikey-nextgen.svg"><link rel="stylesheet" href="/home.css?v=20261026-sidebar-align4"><link rel="stylesheet" href="/project-subpages.css?v=1"><script src="/project-join.js?v=20261026-join1" defer></script><script src="/app-shell-register.js?v=20261026-local1" defer></script></head>
<body><main class="subpage"><header class="subhead"><a href="/projects.html">← 返回我的專案</a><div><p class="eyebrow">iKey · GENERATION 3.1</p><h1>加入專案</h1><p>使用專案管理員提供的邀請碼申請加入。</p></div></header>
<section class="settings-panel"><h2>專案邀請碼</h2><p class="muted">邀請碼由專案管理員提供。是否立即加入或等待審核，由專案的加入政策決定。</p>
<form id="project-join-form"><label for="join-code">輸入邀請碼</label><input id="join-code" name="invite_code" required maxlength="24" minlength="24" pattern="[A-Za-z0-9_-]{24}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="24 位邀請碼"><button id="join-submit" type="submit" disabled>驗證並加入（待後端發布）</button><p id="join-status" role="status">邀請碼加入服務尚未發布，暫不接受送出，以免顯示不實的加入成功。</p></form>
</section></main></body></html>
