<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>iKey｜登入與註冊</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/ikey-nextgen.svg">
  <link rel="stylesheet" href="/style.css?v=20261020-8">
  <link rel="stylesheet" href="/welcome.css?v=20261021-2">
  <script src="/welcome.js?v=20261021-2" defer></script>
  <script src="/app.js?v=20261021-3" defer></script>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="brand">
      <header class="brand">
        <img class="brand-logo" src="/assets/brand/ikey-nextgen.svg" alt="iKey 標誌" width="74" height="74">
        <h1 id="brand">iKey</h1>
        <p>智慧鑰匙管理系統</p>
      </header>
      <div class="tabs" role="tablist" aria-label="帳號操作">
        <button id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="auth-form">登入</button>
        <button id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="auth-form">註冊</button>
      </div>
      <form id="auth-form" novalidate>
        <label for="account">帳號</label>
        <input id="account" name="account" type="text" autocomplete="username" maxlength="24" required placeholder="例如 ikey_user">
        <div id="register-fields" hidden><label for="display-name">顯示名稱</label><input id="display-name" name="display_name" type="text" maxlength="80" autocomplete="nickname" placeholder="請輸入顯示名稱" disabled></div>
        <label for="password">密碼</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="請輸入密碼">
          <button type="button" id="toggle-password" aria-label="顯示密碼" aria-pressed="false" title="顯示密碼"><svg id="eye-open" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eye-closed" hidden viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.3 3.9M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M10 10a3 3 0 0 0 4 4"/></svg></button>
        </div>
        <div id="confirm-field" hidden><label for="confirm">確認密碼</label><div class="password-row"><input id="confirm" name="confirm" type="password" maxlength="128" autocomplete="new-password" placeholder="再次輸入密碼" disabled><button id="toggle-confirm" type="button" aria-label="顯示確認密碼" aria-pressed="false" title="顯示確認密碼"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <p id="register-note" class="hint" hidden>帳號需小寫英文字母開頭，4–24 字元，僅限小寫英文、數字及底線；密碼至少 8 字元。</p>
        <button id="submit" class="submit" type="submit">登入系統</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
      <footer>iKey · 帳號系統建置中</footer>
    </section>
  </main>
  <section id="animationRoot" hidden aria-label="iKey 登入歡迎動畫">
    <div class="welcome-stage"><canvas id="welcomeCanvas" role="img" aria-label="iKey 歡迎動畫"></canvas></div>
    <div id="welcomeStatus" class="welcome-status" role="status" aria-live="polite">
      <span id="welcomeSpinner" class="welcome-spinner" aria-hidden="true"></span>
      <div><strong id="welcomeStatusText">登入成功</strong><br><span id="welcomeStatusSub">載入中…</span></div>
      <svg id="welcomeCheck" class="welcome-check" viewBox="0 0 40 40" hidden aria-hidden="true"><path d="M7 21L16 30L34 10"/></svg>
    </div>
    <button id="welcomeRetry" type="button" hidden>重新載入</button>
  </section>
</body>
</html>
