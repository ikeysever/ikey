<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>iKey 3.1｜建立專案 · 基本資料</title><link rel="icon" type="image/svg+xml" href="/assets/brand/ikey-nextgen.svg"><link rel="stylesheet" href="/home.css?v=20261021-my-projects-v2"><link rel="stylesheet" href="/project-create.css?v=20261024-success1"><script src="/project-create.js?v=20261024-success1" defer></script></head>
<body><main class="create-main"><header class="create-header"><div class="eyebrow">iKey · GENERATION 3.1</div><h1>建立專案</h1><p><span id="create-step-label">步驟 1 · 專案基本資料</span></p></header><div id="create-loading" class="loading" role="status">正在驗證登入狀態…</div><section id="create-content" class="create-section" hidden><form id="create-project-form"><label for="create-project-name">專案名稱</label><input id="create-project-name" name="project_name" required maxlength="80" autocomplete="off" placeholder="請輸入專案名稱" aria-describedby="create-hint"><label for="create-project-description">專案說明 <span class="optional-label">（選填）</span></label><textarea id="create-project-description" name="project_description" maxlength="1000" rows="5" placeholder="簡單介紹這個專案的內容或目的"></textarea><p id="create-hint" class="create-hint">專案名稱為必填，專案說明可以留空。完成所有設定後，於確認頁儲存專案。</p><p id="create-error" class="create-error" role="alert"></p><div class="create-actions"><a href="/projects.html">取消並返回</a><button type="submit">下一步</button></div></form><div id="create-step2" class="create-step2" hidden><h2>借還模式設定</h2><form id="create-settings-form"><fieldset><legend>Q1｜授權方式</legend><label class="create-choice"><input type="radio" name="authorization_method" value="application" required><span>申請授權<small>使用者提出申請，由管理員審核。</small></span></label><label class="create-choice"><input type="radio" name="authorization_method" value="self_registration" required><span>使用者自行登記<small>使用者自行登記使用。</small></span></label></fieldset><fieldset><legend>Q2｜是否需要排程授權？</legend><label class="create-choice"><input type="radio" name="scheduled_authorization" value="yes" required><span>是</span></label><label class="create-choice"><input type="radio" name="scheduled_authorization" value="no" required><span>否</span></label></fieldset><p id="create-settings-error" class="create-error" role="alert"></p><div class="create-actions"><button id="create-step2-back" type="button">上一步</button><button type="submit">下一步</button></div></form></div><div id="create-confirm" class="create-confirm" hidden aria-live="polite"><h2>專案設定確認</h2><p>專案名稱：</p><strong id="create-confirm-name"></strong><p>專案說明：</p><p id="create-confirm-description"></p><p>授權方式：<strong id="create-confirm-authorization"></strong></p><p>排程授權：<strong id="create-confirm-schedule"></strong></p><p>確認設定後按「建立專案」，系統會儲存至資料庫。</p><p id="create-save-error" class="create-error" role="alert"></p><div class="create-actions"><button id="create-back" type="button">返回修改設定</button><button id="create-save" type="button">建立專案</button></div></div></section><div id="create-success-overlay" class="create-success-overlay" role="status" aria-live="assertive" hidden><div class="create-success-panel"><div class="create-success-ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="create-success-circle" cx="50" cy="50" r="42"/><path class="create-success-check" d="M27 51 L44 67 L74 34"/></svg></div><h2>專案建立成功！</h2><p id="create-success-name"></p><p class="create-success-loading"><span class="create-success-spinner" aria-hidden="true"></span>正在更新我的專案…</p></div></div></main></body></html>
