<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>iKey 3.1｜建立專案 · 基本資料</title><link rel="icon" type="image/svg+xml" href="/assets/brand/ikey-nextgen.svg"><link rel="stylesheet" href="/home.css?v=20261021-my-projects-v2"><link rel="stylesheet" href="/project-create.css?v=3"><script src="/project-create.js?v=3" defer></script></head>
<body><main class="create-main"><header class="create-header"><div class="eyebrow">iKey · GENERATION 3.1</div><h1>建立專案</h1><p><span id="create-step-title">步驟 1 · 專案基本資料</span></p></header><div id="create-loading" class="loading" role="status">正在驗證登入狀態…</div><section id="create-content" class="create-section" hidden><form id="create-project-form"><label for="create-project-name">專案名稱</label><input id="create-project-name" name="project_name" required maxlength="80" autocomplete="off" placeholder="請輸入專案名稱" aria-describedby="create-hint"><label for="create-project-description">專案說明 <span class="optional-label">（選填）</span></label><textarea id="create-project-description" name="project_description" maxlength="1000" rows="5" placeholder="簡單介紹這個專案的內容或目的"></textarea><p id="create-hint" class="create-hint">專案名稱為必填，專案說明可以留空。目前此階段不會寫入資料庫。</p><p id="create-error" class="create-error" role="alert"></p><div class="create-actions"><a href="/projects.html">取消並返回</a><button type="submit">下一步</button></div></form><div id="create-step2" class="create-step2" hidden><h2>借還模式設定</h2><p class="create-hint">請選擇授權方式，並設定是否需要排程授權。</p><form id="create-settings-form"><fieldset><legend>Q1｜授權方式</legend><label class="create-option"><input type="radio" name="authorization_method" value="application" required>申請授權 <small>使用者提出申請，由管理員審核授權</small></label><label class="create-option"><input type="radio" name="authorization_method" value="self_registration" required>使用者自行登記 <small>使用者自行登記使用</small></label></fieldset><fieldset><legend>Q2｜是否需要排程授權？</legend><label class="create-option"><input type="radio" name="scheduled_authorization" value="yes" required>是</label><label class="create-option"><input type="radio" name="scheduled_authorization" value="no" required>否</label></fieldset><p id="create-settings-error" class="create-error" role="alert"></p><div class="create-actions"><button type="button" id="create-step2-back">上一步</button><button type="submit">確認設定</button></div></form></div><div id="create-confirm" class="create-confirm" hidden aria-live="polite"><h2>專案基本資料已填寫</h2><p>專案名稱：</p><strong id="create-confirm-name"></strong><p>專案說明：</p><p id="create-confirm-description"></p><p>授權方式：<strong id="create-confirm-auth"></strong></p><p>排程授權：<strong id="create-confirm-schedule"></strong></p><p>目前僅提供設定預覽，尚未建立或儲存專案。</p><button id="create-back" type="button">返回修改設定</button></div></section></main></body></html>
