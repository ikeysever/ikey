<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>iKey 3.1｜專案管理</title><link rel="icon" href="/assets/brand/ikey-nextgen.svg"><link rel="stylesheet" href="/home.css?v=20261026-sidebar-align4"><script src="/project-display-cache.js?v=20261109-sync2" defer></script><script src="/app-shell-register.js?v=20261026-local1" defer></script><link rel="stylesheet" href="/project-cards.css?v=20261109-preload1"><script>
/* Navigation is bound before remote scripts and is independent of project API latency. */
(function(){
 document.addEventListener('click',function(event){
  const trigger=event.target.closest('[data-pc-open], [data-pc-back]');
  if(!trigger)return;
  const menu=document.getElementById('pc-menu'),content=document.getElementById('pc-content');
  if(!menu||!content)return;
  if(trigger.hasAttribute('data-pc-open')){
   const id=trigger.getAttribute('data-pc-open');
   const pane=[...document.querySelectorAll('[data-pc-pane]')].find(p=>p.getAttribute('data-pc-pane')===id);
   if(!pane||trigger.hidden||trigger.disabled||!document.documentElement.dataset.projectPermissionsReady||document.querySelector('[data-pc-open="'+id+'"]')?.hidden)return;
   menu.hidden=true;content.hidden=false;
   document.querySelectorAll('[data-pc-pane]').forEach(p=>{p.hidden=p!==pane;});
   let hint=pane.querySelector('[data-pc-loading]');
   if(!hint){hint=document.createElement('p');hint.setAttribute('data-pc-loading','');hint.setAttribute('role','status');hint.textContent='資料載入中…';pane.insertBefore(hint,pane.querySelector('h2')?.nextSibling||pane.firstChild);}
   hint.hidden=document.documentElement.dataset.projectReady==='true';
   pane.querySelector('[data-pc-back]')?.focus();
  }else{
   const id=trigger.closest('[data-pc-pane]')?.getAttribute('data-pc-pane');
   content.hidden=true;menu.hidden=false;
   document.querySelectorAll('[data-pc-pane]').forEach(p=>p.hidden=true);
   if(id)menu.querySelector('[data-pc-open="'+id+'"]')?.focus();
  }
 });
 document.addEventListener('ikey:project-loaded',function(){
  document.documentElement.dataset.projectReady='true';
  document.querySelectorAll('[data-pc-loading]').forEach(h=>h.hidden=true);
 });
})();
</script></head>
