<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>iKey 3.1｜裝置預登入</title><link rel="icon" type="image/svg+xml" href="/assets/brand/ikey-nextgen.svg">
<link rel="stylesheet" href="/home.css?v=20261026-sidebar-align4"><script src="/home.js?v=20261026-desktop-sidebar-hotfix" defer></script>
<script src="/app-shell-register.js?v=20261026-local1" defer>
</script></head>
<body>
<button id="menu-toggle" class="menu-toggle" type="button" aria-label="開啟選單" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
<div class="app"><aside id="sidebar" class="side">
<a class="brand brand-home-link" href="/home.html" aria-label="iKey 首頁"><img src="/assets/brand/ikey-nextgen.svg" alt="" width="52" height="52"><div><strong>iKey</strong><small>智慧鑰匙管理系統</small></div></a>
<nav aria-label="主要導覽"><a href="/home.html">首頁</a><div class="project-nav"><div class="project-nav-heading"><button id="project-menu-toggle" class="project-menu-toggle" type="button" aria-label="展開我的專案" aria-expanded="false" aria-controls="project-menu-content"><span class="project-menu-chevron" aria-hidden="true">▶</span></button><a class="project-nav-link" href="/projects.html">我的專案</a></div><div id="project-menu-content" hidden><p class="project-menu-empty">目前沒有專案</p></div></div><a class="active" href="/super-admin.html">超級管理員</a></nav>
<div class="side-bottom"><a class="account-link" href="/account.html">帳號管理</a><button id="logout" class="logout-button" type="button">登出</button></div></aside>
<main><header class="hero"><div class="eyebrow">iKey · GENERATION 3.1</div><h1>裝置預登入</h1><p>超級管理員 / 裝置預登入</p></header>
<div id="loading" class="loading" role="status">正在驗證登入狀態…</div>
<section id="account-empty-page" class="card" hidden aria-label="裝置預登入頁面">
<h2>裝置預登入</h2>
<p>由超級管理員預先登錄裝置。裝置預登錄與專案綁定是不同流程；一個專案可綁定多台已登錄裝置。</p>
<p><button id="add-device-button" type="button" aria-expanded="false" aria-controls="add-device-form" style="padding:12px 20px;border:1px solid rgba(100,228,194,.5);border-radius:12px;background:#173d4b;color:#efffff;font:inherit;font-weight:700;cursor:pointer">＋ 新增裝置</button></p>
<form id="add-device-form" hidden style="max-width:520px;display:grid;gap:14px;padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:14px">
<h3 style="margin:0">新增裝置（介面預覽）</h3>
<label for="device-name">裝置名稱</label><input id="device-name" name="deviceName" type="text" maxlength="80" required placeholder="例如：實習工廠鑰匙櫃" style="padding:12px;border-radius:9px">
<label for="device-id">裝置 ID</label><input id="device-id" name="deviceId" type="text" maxlength="80" required placeholder="輸入裝置識別碼" style="padding:12px;border-radius:9px">
<label for="device-password">裝置密碼</label><input id="device-password" name="devicePassword" type="password" autocomplete="new-password" required placeholder="設定預登錄密碼" style="padding:12px;border-radius:9px">
<p style="margin:0;opacity:.8">目前僅為前端介面預覽，不會儲存密碼、建立裝置或連線 API。</p>
<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="submit" style="padding:10px 16px;border-radius:9px">確認（預覽）</button><button id="cancel-device-button" type="button" style="padding:10px 16px;border-radius:9px">取消</button></div>
</form>
<p id="add-device-status" role="status" aria-live="polite" hidden></p>
<p><a href="/super-admin.html">← 返回超級管理員</a></p>
</section>
<script>
(()=>{
 const toggle=document.getElementById("add-device-button"),form=document.getElementById("add-device-form"),status=document.getElementById("add-device-status");
 form.style.display="none";
 toggle.addEventListener("click",()=>{const show=form.hidden;form.hidden=!show;form.style.display=show?"grid":"none";toggle.setAttribute("aria-expanded",String(show));status.hidden=true;});
 document.getElementById("cancel-device-button").addEventListener("click",()=>{form.reset();form.hidden=true;form.style.display="none";toggle.setAttribute("aria-expanded","false");status.hidden=true;});
 form.addEventListener("submit",event=>{event.preventDefault();status.textContent="目前為介面預覽：未建立裝置，也未儲存任何資料。";status.hidden=false;});
})();
</script>
</main></div></body></html>
