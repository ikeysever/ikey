<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iKey 3.1｜裝置管理</title><link rel="icon" href="/assets/brand/ikey-nextgen.svg"><link rel="stylesheet" href="/home.css?v=20261026-devices"><link rel="stylesheet" href="/project-subpages.css?v=1"><script src="/project-devices.js?v=20261026-api-fix" defer></script><script src="/project-display-cache.js?v=20261026-cache1" defer></script><script src="/app-shell-register.js?v=20261026-local1" defer></script></head><body><main class="subpage"><header class="subhead"><a id="back-link" href="/projects.html">← 返回專案</a><div><p class="eyebrow">iKey · GENERATION 3.1</p><h1>裝置管理</h1><p id="project-label">正在驗證專案與管理員權限…</p></div></header><section id="error" role="alert" hidden></section><div id="admin-content" hidden><div class="device-toolbar"><label>搜尋裝置<input type="search" id="device-search" placeholder="搜尋裝置名稱或 ID" autocomplete="off"></label><button id="add-device" type="button">＋ 新增裝置</button></div><p class="muted">裝置 ID 與密碼由超級管理員於出廠時登錄。未通過伺服器與實體設備驗證前，不會新增或控制裝置。</p><div class="bulk-toolbar"><span id="selected-count">已選取 0 台</span><button type="button" id="group-create" disabled>複選群組</button><button type="button" id="group-remove" disabled>複選解群組</button></div><p id="device-status" role="status">正在確認裝置資料服務…</p><div id="device-grid" class="device-grid" aria-label="專案裝置"></div></div><dialog id="add-dialog"><form method="dialog"><h2>新增裝置</h2><label>出廠裝置 ID<input id="factory-device-id" autocomplete="off" required></label><label>出廠裝置密碼<input id="factory-device-password" type="password" autocomplete="off" required></label><p class="muted">尚未開放裝置出廠憑證驗證。此表單不會送出密碼，也不會儲存於瀏覽器。</p><button type="button" disabled>驗證並新增（待串接）</button><button type="submit">關閉</button></form></dialog><dialog id="settings-dialog"><form method="dialog"><h2>裝置設定</h2><label>裝置 ID<input id="device-id" readonly></label><label>裝置名稱<input id="device-name" disabled></label><label>運作模式<select id="device-lock-mode" disabled><option value="locked">常鎖</option><option value="open">常開</option></select></label><label>心跳檢查間隔（分鐘）<input id="device-heartbeat" type="number" min="1" disabled></label><label class="check"><input id="device-auto-update" type="checkbox" disabled>允許自動更新韌體</label><button type="button" disabled>連線測試（待串接）</button><button type="button" disabled>儲存設定（待串接）</button><button type="submit">關閉</button></form></dialog></main></body></html>
