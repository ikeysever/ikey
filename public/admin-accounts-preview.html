<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iKey 3.1｜帳號與權限預覽</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#f8fafc;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#1b3150,#0b1220 42%,#070c16)}main{max-width:960px;margin:auto;padding:32px 18px}.eyebrow{color:#63d8e8;font-size:12px}h1{margin:5px 0}p,small{color:#a6b2c5}.panel,.stat,.item{background:rgba(20,31,52,.9);border:1px solid #293c55;border-radius:15px;padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat strong{display:block;font-size:28px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,select,button{font:inherit;border-radius:9px;padding:11px;background:#142139;color:#f8fafc;border:1px solid #45607c}input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:#63d8e8}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #63d8e8}.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin:9px 0}.item small{display:block;margin-top:5px}.pill{font-size:12px;border-radius:30px;padding:5px 10px;background:#263c56}.ok{color:#7de2b1}.bad{color:#ff9a9a}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}#detail p{padding:8px 0;border-bottom:1px solid #293c55}.note{font-size:13px;margin-top:22px}.tabs button[aria-pressed=true]{background:#24456b}.back{margin-bottom:16px}@media(max-width:500px){.stat{padding:12px}.stat strong{font-size:22px}}</style></head><body><main><div class="eyebrow">iKey 3.1 / ADMINISTRATION</div><h1>帳號與權限 <span class="pill">DEMO</span></h1><p>智慧鑰匙管理系統｜獨立模擬預覽，不讀寫正式帳號</p><div class="stats"><div class="stat"><small>帳號總數</small><strong id="total">4</strong></div><div class="stat"><small>啟用中</small><strong class="ok" id="enabled">3</strong></div><div class="stat"><small>已停用</small><strong class="bad" id="disabled">1</strong></div></div><section class="panel"><div class="controls tabs"><button id="accountsTab" aria-pressed="true">帳號管理</button><button id="rolesTab" aria-pressed="false">權限說明</button></div><div id="accounts"><div id="listView"><div class="controls"><input id="search" placeholder="搜尋姓名、編號或科別…" aria-label="搜尋帳號"><select id="filter" aria-label="篩選身分"><option>全部</option><option>管理員</option><option>教師</option><option>學生</option></select></div><div id="list"></div></div><div id="detail" class="hidden"><button id="back" class="back">← 返回列表</button><h2 id="name"></h2><div id="fields"></div><div class="controls"><label for="role">模擬修改身分</label><select id="role"><option>學生</option><option>教師</option><option>管理員</option></select></div><div class="actions"><button id="save">儲存模擬身分</button><button id="toggle">切換啟用狀態</button></div></div></div><div id="roles" class="hidden"><h2>角色說明</h2><p><b>管理員</b>：管理系統設定與帳號；正式功能需後端授權。</p><p><b>教師</b>：查看個人資料與授權借還資訊。</p><p><b>學生</b>：查看個人資料及可使用的借還功能。</p><small>正式權限矩陣尚待核定。</small></div></section><p class="note">🔒 此頁僅含範例資料，所有操作只在目前瀏覽器記憶體生效，重新整理即重設。</p></main><script>
'use strict';const users=[{id:'T2947153',name:'測試老師',role:'教師',dept:'電機科',enabled:true,line:'未綁定'},{id:'S000001',name:'測試學生 A',role:'學生',dept:'電機科',enabled:true,line:'已綁定'},{id:'S000002',name:'測試學生 B',role:'學生',dept:'電子科',enabled:false,line:'未綁定'},{id:'ADM-DEMO',name:'系統管理員（範例）',role:'管理員',dept:'系統管理',enabled:true,line:'未綁定'}];const $=id=>document.getElementById(id);let current=null;function render(){ $('total').textContent=users.length;$('enabled').textContent=users.filter(u=>u.enabled).length;$('disabled').textContent=users.filter(u=>!u.enabled).length;const q=$('search').value.toLowerCase(),f=$('filter').value;$('list').replaceChildren();for(const u of users.filter(u=>(f==='全部'||u.role===f)&&[u.id,u.name,u.dept].some(s=>s.toLowerCase().includes(q)))){const b=document.createElement('button');b.className='item';const left=document.createElement('span');const title=document.createElement('b');title.textContent=u.name+' · '+u.role;const sub=document.createElement('small');sub.textContent=u.id+' · '+u.dept+' · LINE：'+u.line;left.append(title,sub);const status=document.createElement('span');status.className=u.enabled?'ok':'bad';status.textContent=u.enabled?'● 啟用':'● 停用';b.append(left,status);b.onclick=()=>openUser(u);$('list').append(b)}if(!$('list').children.length)$('list').textContent='找不到符合條件的帳號。'}function openUser(u){current=u;$('listView').classList.add('hidden');$('detail').classList.remove('hidden');$('name').textContent=u.name;$('fields').replaceChildren();for(const [k,v] of Object.entries({帳號編號:u.id,科別:u.dept,LINE綁定:u.line,狀態:u.enabled?'啟用':'停用'})){const p=document.createElement('p');p.textContent=k+'：'+v;$('fields').append(p)}$('role').value=u.role;$('toggle').textContent=u.enabled?'模擬停用帳號':'模擬啟用帳號'}$('search').oninput=render;$('filter').onchange=render;$('back').onclick=()=>{$('detail').classList.add('hidden');$('listView').classList.remove('hidden');render()};$('save').onclick=()=>{current.role=$('role').value;openUser(current)};$('toggle').onclick=()=>{current.enabled=!current.enabled;openUser(current);render()};for(const [tab,section,other] of [['accountsTab','accounts','roles'],['rolesTab','roles','accounts']]){$(tab).onclick=()=>{$(section).classList.remove('hidden');$(other).classList.add('hidden');$('accountsTab').setAttribute('aria-pressed',String(section==='accounts'));$('rolesTab').setAttribute('aria-pressed',String(section==='roles'))}}render();
</script></body></html>
