<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>iKey 3.1｜超級管理員</title><link rel="icon" type="image/svg+xml" href="/assets/brand/ikey-nextgen.svg">
<link rel="stylesheet" href="/home.css?v=20261026-sidebar-align4"><script src="/home.js?v=20261026-desktop-sidebar-hotfix" defer></script>
<script src="/app-shell-register.js?v=20261026-local1" defer>
</script></head>
<body>
<button id="menu-toggle" class="menu-toggle" type="button" aria-label="開啟選單" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
<div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
<div class="app"><aside id="sidebar" class="side">
<a class="brand brand-home-link" href="/home.html" aria-label="iKey 首頁"><img src="/assets/brand/ikey-nextgen.svg" alt="" width="52" height="52"><div><strong>iKey</strong><small>智慧鑰匙管理系統</small></div></a>
<nav aria-label="主要導覽"><a href="/home.html">首頁</a><div class="project-nav"><div class="project-nav-heading"><button id="project-menu-toggle" class="project-menu-toggle" type="button" aria-label="展開我的專案" aria-expanded="false" aria-controls="project-menu-content"><span class="project-menu-chevron" aria-hidden="true">▶</span></button><a class="project-nav-link" href="/projects.html">我的專案</a></div><div id="project-menu-content" hidden><p class="project-menu-empty">目前沒有專案</p></div></div><a class="active" href="/super-admin.html" aria-current="page">超級管理員</a></nav>
<div class="side-bottom"><a class="account-link" href="/account.html">帳號管理</a><button id="logout" class="logout-button" type="button">登出</button></div></aside>
<main class="projects-page"><header class="hero"><div class="eyebrow">iKey · GENERATION 3.1</div><h1>超級管理員</h1><p>系統管理控制台</p></header>
<div id="loading" class="loading" role="status">正在驗證登入狀態…</div>
<section id="account-empty-page" class="admin-panel" hidden aria-label="超級管理員控制台">
<style>
.admin-panel{max-width:1100px;padding:0!important;background:transparent!important;border:0!important;border-radius:0!important}
.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.admin-head h2{margin:0 0 6px;font-size:1.35rem}.admin-muted{color:#9db1c7;font-size:.9rem;margin:0}
.admin-pill{border:1px solid #426077;border-radius:100px;padding:7px 12px;color:#a9d8e5;font-size:.8rem}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.admin-box{padding:22px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(184,216,238,.12)}
.admin-box h3{margin:0 0 8px;font-size:1.1rem}.admin-box p{color:#9db1c7;font-size:.86rem;line-height:1.6}
.admin-panel label{display:block;margin:14px 0 8px;color:#d6e5f3;font-size:.88rem}
.admin-panel input{width:100%;box-sizing:border-box;padding:12px 14px;background:#0b1929;color:#fff;border:1px solid #3b566e;border-radius:11px;font:inherit}
.admin-panel button{font:inherit;font-weight:650;border:1px solid #466a80;border-radius:11px;padding:11px 15px;background:#193449;color:#e8f8ff;cursor:pointer}
.admin-panel button.primary{background:linear-gradient(110deg,#157e87,#1b657f);border-color:#398c96}
.admin-panel button:disabled{opacity:.42;cursor:not-allowed}
.admin-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.admin-message{min-height:22px;color:#b9d9e8;font-size:.87rem;overflow-wrap:anywhere}
@media(max-width:720px){.admin-grid{grid-template-columns:1fr}.admin-panel{padding:18px!important}}
</style>
<div class="projects-toolbar" style="margin-bottom:20px"><div class="projects-heading">裝置管理 <span style="font-weight:400;color:#9db1c7;font-size:.85rem">· 超級管理員</span></div><div class="projects-actions"><button class="projects-create" type="button" id="admin-new-device">＋ 新增裝置</button><button type="button" id="admin-focus-search">⌕ 查詢裝置</button></div></div><p class="admin-muted" style="margin:0 0 20px">管理裝置登錄與連線測試</p>
<div class="admin-grid">
<div class="admin-box"><h3>＋ 新增裝置</h3><p>建立 8 碼裝置 ID。裝置名稱在綁定專案時設定。</p>
<form id="admin-register"><label for="admin-password">裝置密碼</label><input id="admin-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 個字元" required>
<div class="admin-actions"><button class="primary" id="admin-create" type="submit">建立裝置</button></div></form>
<p class="admin-message" id="admin-create-status" role="status" aria-live="polite"></p></div>
<div class="admin-box"><h3>⌘ 裝置設定</h3><p>輸入已登錄的裝置 ID，查詢登錄狀態。</p>
<label for="admin-device-id">裝置 ID</label><input id="admin-device-id" maxlength="8" autocomplete="off" placeholder="8 碼裝置 ID">
<div class="admin-actions"><button id="admin-check" type="button">查詢狀態</button></div>
<p class="admin-message" id="admin-device-status" role="status" aria-live="polite">尚未查詢裝置</p>
<div class="admin-actions"><button type="button" disabled title="待完成 ESP32 控制與回報驗證">開鎖測試</button><button type="button" disabled title="待完成 ESP32 控制與回報驗證">上鎖測試</button></div></div>
</div>
<p class="admin-muted" style="margin-top:20px">安全提示：實體控制功能尚未串接；僅在後端確認操作成功後顯示結果。</p>
</section>
<script>
(()=>{
const create=document.getElementById('admin-create-status'),status=document.getElementById('admin-device-status');
document.getElementById('admin-new-device').addEventListener('click',()=>document.getElementById('admin-password').focus());
document.getElementById('admin-focus-search').addEventListener('click',()=>document.getElementById('admin-device-id').focus());
document.getElementById('admin-register').addEventListener('submit',async e=>{
e.preventDefault();const btn=document.getElementById('admin-create');btn.disabled=true;create.textContent='正在建立裝置…';
try{const response=await fetch('/api/devices/pre-register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('admin-password').value})});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||'建立失敗');document.getElementById('admin-device-id').value=data.device_id;document.getElementById('admin-password').value='';create.textContent='建立成功！裝置 ID：'+data.device_id;}
catch(err){create.textContent=err.message||'建立失敗';}finally{btn.disabled=false;}
});
document.getElementById('admin-check').addEventListener('click',async()=>{
const id=document.getElementById('admin-device-id').value.trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{8}$/.test(id)){status.textContent='請輸入正確的 8 碼裝置 ID';return;}status.textContent='正在查詢…';
try{const response=await fetch('/api/devices/'+encodeURIComponent(id)+'/status',{credentials:'same-origin',cache:'no-store'});const data=await response.json();if(!response.ok||!data.success)throw Error(data.message||'查詢失敗');status.textContent='登錄狀態：'+data.registration_status+'｜實體連線：尚未驗證';}catch(err){status.textContent=err.message||'查詢失敗';}
});
})();
</script>
</main></div></body></html>
